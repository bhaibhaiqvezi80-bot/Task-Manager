<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task & Notes Manager</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--primary);
            text-align: center;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: var(--bg);
            color: var(--text-secondary);
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
        }

        .input-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            border-color: var(--primary);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button.add-btn {
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.add-btn:hover {
            background: var(--primary-hover);
        }

        .list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .item-card {
            padding: 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .item-content h3 {
            font-size: 1.05rem;
            margin-bottom: 4px;
        }

        .item-content p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            word-break: break-word;
        }

        .item-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            padding: 4px;
        }

        .delete-btn {
            color: var(--danger);
        }

        .complete-btn {
            color: var(--success);
        }

        .completed h3, .completed p {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Task & Notes Manager</h1>

        <!-- Navigation Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('tasks')">Tasks</button>
            <button class="tab-btn" onclick="switchTab('notes')">Notes</button>
        </div>

        <!-- Task Section -->
        <div id="tasks-section">
            <div class="input-section">
                <input type="text" id="task-input" placeholder="What needs to be done?">
                <button class="add-btn" onclick="addTask()">Add Task</button>
            </div>
            <div id="task-list" class="list"></div>
        </div>

        <!-- Notes Section -->
        <div id="notes-section" class="hidden">
            <div class="input-section">
                <input type="text" id="note-title" placeholder="Note Title">
                <textarea id="note-input" placeholder="Write your note here..."></textarea>
                <button class="add-btn" onclick="addNote()">Add Note</button>
            </div>
            <div id="note-list" class="list"></div>
        </div>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        let notes = JSON.parse(localStorage.getItem('notes')) || [];

        function switchTab(tab) {
            const taskBtn = document.querySelectorAll('.tab-btn')[0];
            const noteBtn = document.querySelectorAll('.tab-btn')[1];
            const taskSec = document.getElementById('tasks-section');
            const noteSec = document.getElementById('notes-section');

            if (tab === 'tasks') {
                taskBtn.classList.add('active');
                noteBtn.classList.remove('active');
                taskSec.classList.remove('hidden');
                noteSec.classList.add('hidden');
            } else {
                noteBtn.classList.add('active');
                taskBtn.classList.remove('active');
                noteSec.classList.remove('hidden');
                taskSec.classList.add('hidden');
            }
        }

        function addTask() {
            const input = document.getElementById('task-input');
            const text = input.value.trim();
            if (!text) return;

            tasks.push({ id: Date.now(), text, completed: false });
            input.value = '';
            saveAndRender();
        }

        function toggleTask(id) {
            tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
            saveAndRender();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveAndRender();
        }

        function addNote() {
            const titleInput = document.getElementById('note-title');
            const bodyInput = document.getElementById('note-input');
            const title = titleInput.value.trim();
            const body = bodyInput.value.trim();
            if (!title && !body) return;

            notes.push({ id: Date.now(), title: title || 'Untitled', body });
            titleInput.value = '';
            bodyInput.value = '';
            saveAndRender();
        }

        function deleteNote(id) {
            notes = notes.filter(n => n.id !== id);
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
            localStorage.setItem('notes', JSON.stringify(notes));
            render();
        }

        function render() {
            // Render Tasks
            const taskList = document.getElementById('task-list');
            taskList.innerHTML = tasks.map(t => `
                <div class="item-card ${t.completed ? 'completed' : ''}">
                    <div class="item-content">
                        <h3>${t.text}</h3>
                    </div>
                    <div class="item-actions">
                        <button class="action-btn complete-btn" onclick="toggleTask(${t.id})">✔</button>
                        <button class="action-btn delete-btn" onclick="deleteTask(${t.id})">🗑</button>
                    </div>
                </div>
            `).join('');

            // Render Notes
            const noteList = document.getElementById('note-list');
            noteList.innerHTML = notes.map(n => `
                <div class="item-card">
                    <div class="item-content">
                        <h3>${n.title}</h3>
                        <p>${n.body}</p>
                    </div>
                    <div class="item-actions">
                        <button class="action-btn delete-btn" onclick="deleteNote(${n.id})">🗑</button>
                    </div>
                </div>
            `).join('');
        }

        render();
    </script>
</body>
                                                                                  </html>
